<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Watermark: Ritam // Aesthetic iOS Liquid Glass Monogram Avatar -->
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <rect x="24" y="24" width="352" height="352" rx="76" fill="none" stroke="url(#neonRim)" stroke-width="2.5" opacity="0.6" filter="url(#glow)" />
  <rect x="24" y="24" width="352" height="352" rx="76" fill="none" stroke="url(#neonRim)" stroke-width="2" opacity="0.9" />

  <!-- Inner Caustic Ellipse -->
  <ellipse cx="200" cy="110" rx="140" ry="70" fill="url(#glassSheen)" />

  <!-- Aesthetic Geometric Glyph / Monogram "R" -->
  <g transform="translate(100, 90)">
    <!-- Back drop glow -->
    <path d="M40 220 V20 H105 C145 20 170 42 170 78 C170 106 150 126 122 133 L174 220 H124 L78 142 H40 Z"
          fill="none" stroke="url(#neonRim)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity="0.4" filter="url(#glow)" />
    <!-- Main crisp stroke -->
    <path d="M40 220 V20 H105 C145 20 170 42 170 78 C170 106 150 126 122 133 L174 220 H124 L78 142 H40 Z"
          fill="none" stroke="url(#neonRim)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Inner Bowl -->
    <path d="M78 54 H102 C122 54 134 64 134 78 C134 92 122 102 102 102 H78 V54 Z"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.95" stroke-linejoin="round" />
    <!-- Star sparkle accent -->
    <circle cx="168" cy="38" r="4" fill="#38BDF8" filter="url(#glow)" />
    <path d="M168 28 L170 38 L180 40 L170 42 L168 52 L166 42 L156 40 L166 38 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
